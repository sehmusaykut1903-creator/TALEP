<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALEP v4.0 - Yönlendiriliyor...</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0f172a;
        color: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .loader {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
      }
      .ring-1 {
        position: absolute;
        width: 80px;
        height: 80px;
        border: 2px solid rgba(6, 182, 212, 0.15);
        border-radius: 50%;
        animation: pulse 2.5s infinite ease-in-out;
      }
      .ring-2 {
        position: absolute;
        width: 60px;
        height: 60px;
        border: 2px solid rgba(6, 182, 212, 0.3);
        border-radius: 50%;
        animation: pulse 2s infinite ease-in-out;
        animation-delay: 0.3s;
      }
      .icon {
        width: 44px;
        height: 44px;
        background-color: rgba(6, 182, 212, 0.08);
        border: 2px solid #06b6d4;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
      }
      .title {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.05em;
        margin: 0 0 4px 0;
        color: #f8fafc;
      }
      .accent {
        color: #06b6d4;
      }
      .desc {
        font-size: 12px;
        color: #94a3b8;
        margin: 0;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(0.95); opacity: 0.3; }
        50% { transform: scale(1.1); opacity: 0.7; }
      }
    </style>
    <script type="text/javascript">
      // SPA routing redirect hack
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;

        // Extract repository subfolder if we are on GitHub Pages
        var hostname = window.location.hostname;
        var isGitHubPages = hostname.indexOf('github.io') !== -1;
        var segments = path.split('/');
        var repoName = isGitHubPages && segments[1] ? '/' + segments[1] : '';

        // Safely map direct subpaths to the corresponding SPA hashroute
        var relativePath = path;
        if (repoName && path.indexOf(repoName) === 0) {
          relativePath = path.slice(repoName.length);
        }

        if (relativePath && relativePath !== '/') {
          // Redirect browser to root page while preserving subroute via '#'
          var destination = window.location.protocol + '//' + window.location.host + repoName + '/#' + relativePath + search + hash;
          window.location.replace(destination);
        } else {
          // Standard home redirect as fallback
          var home = window.location.protocol + '//' + window.location.host + repoName + '/';
          window.location.replace(home);
        }
      })();
    </script>
  </head>
  <body>
    <div class="loader">
      <div class="ring-1"></div>
      <div class="ring-2"></div>
      <div class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 16.5c-1.5 1.25-2.5 3-2.5 5h20c0-2-1-3.75-2.5-5M10 2h4M12 2v20M8 22h8"></path>
        </svg>
      </div>
    </div>
    <h1 class="title">TALEP <span class="accent">v4.0</span></h1>
    <p class="desc">Güvenli portal yönlendiriliyor...</p>
  </body>
</html>
