<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TALEP v4.0" />
    <link rel="apple-touch-icon" href="https://img.icons8.com/sf-regular-filled/512/06b6d4/test-tube.png" />
    <link rel="manifest" href="./manifest.json" />
    <title>TALEP v4.0 Premium | Toksikolojik Akıllı Laboratuvar Eşleştirme Platformu</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <style>
      /* Hide the top Google translate toolbar and iframe */
      .skiptranslate.goog-te-banner-frame { display: none !important; }
      body { top: 0 !important; }
      /* Hide the widget itself */
      #google_translate_element { display: none !important; }
      .goog-tooltip { display: none !important; }
      .goog-tooltip:hover { display: none !important; }
      .goog-text-highlight { background-color: transparent !important; border: none !important; box-shadow: none !important; }
    </style>
  </head>
  <body>
    <!-- Google Translate Element placeholder -->
    <div id="google_translate_element"></div>
    <div id="root"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'tr',
            autoDisplay: false
          }, 
          'google_translate_element'
        );
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
