<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TALEP v4.0" />
    <link rel="apple-touch-icon" href="https://img.icons8.com/sf-regular-filled/512/06b6d4/test-tube.png" />
    <link rel="manifest" href="./manifest.json" />
    <title>TALEP v4.0 Premium | Toksikolojik Akıllı Laboratuvar Eşleştirme Platformu</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Highly resilient Production Diagnostics Overlay & Relative Path Failsafe -->
    <script>
      (function() {
        var errors = [];
        window.addEventListener('error', function(e) {
          var errorMsg = e.message + ' (at ' + e.filename + ':' + e.lineno + ':' + e.colno + ')';
          errors.push(errorMsg);
          console.error("[TALEP Global Error Boundary]:", errorMsg);
          showDiagnosticOverlay("Script/Asset Yükleme veya Çalışma Zamanı Hatası:\n" + errorMsg);
        });

        window.addEventListener('unhandledrejection', function(e) {
          var rejectMsg = 'Unhandled Promise: ' + (e.reason && (e.reason.stack || e.reason.message || e.reason));
          errors.push(rejectMsg);
          console.error("[TALEP Promise Boundary]:", rejectMsg);
          showDiagnosticOverlay("Asenkron Servis Çökmesi:\n" + rejectMsg);
        });

        // Safe trailing slash redirector to fix subpath asset failures
        var pathname = window.location.pathname;
        if (pathname && !pathname.endsWith('/') && !pathname.split('/').pop().includes('.')) {
          window.location.replace(window.location.origin + pathname + '/' + window.location.search + window.location.hash);
        }

        function showDiagnosticOverlay(msg) {
          // Display a diagnostic overlay if rendering crashes early
          var el = document.getElementById('talep-diagnostic-overlay');
          if (!el) {
            el = document.createElement('div');
            el.id = 'talep-diagnostic-overlay';
            el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#090d16;color:#f8fafc;z-index:999999;font-family:monospace;padding:24px;overflow:auto;font-size:12px;line-height:1.6;';
            el.innerHTML = '<h3 style="color:#06b6d4;margin-top:0;font-size:16px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:12px;">🔬 TALEP v4.0 Premium Teşhis Paneli</h3>' +
                           '<p style="color:#f43f5e;font-weight:bold;font-size:13px;margin:16px 0 8px 0;">Kritik bir yükleme veya entegrasyon hatası engellendi:</p>' +
                           '<div id="talep-diagnostic-errors" style="background:#1e293b;border:1px solid rgba(255,255,255,0.1);padding:16px;border-radius:12px;white-space:pre-wrap;margin:12px 0;max-height:300px;overflow-y:auto;color:#ef4444;font-size:11px;"></div>' +
                           '<div style="margin:24px 0 16px 0;">' +
                           '<button onclick="window.location.reload()" style="background:#06b6d4;color:#090d16;border:none;padding:12px 20px;font-weight:bold;border-radius:10px;cursor:pointer;margin-right:12px;font-size:12px;">Sistemi Yenile</button>' +
                           '<button onclick="localStorage.clear();sessionStorage.clear();window.location.reload();" style="background:transparent;color:#f43f5e;border:1px solid rgba(244,63,94,0.3);padding:12px 20px;font-weight:bold;border-radius:10px;cursor:pointer;font-size:12px;">Önbelleği Temizle ve Güvenli Aç</button>' +
                           '</div>' +
                           '<p style="color:#64748b;font-size:10px;margin-top:16px;">Tıbbi Karar Destek Sistemi Teşhis Arayüzü. Birkaç saniye içinde çözülmezse önbellek temizleme seçeneğini kullanabilirsiniz.</p>';
            document.body.appendChild(el);
          }
          var errBox = document.getElementById('talep-diagnostic-errors');
          if (errBox) {
            errBox.textContent += msg + '\n\n';
          }
        }

        // Resilient checking mechanism: 4500ms max loading timeout
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
            var loadedDetails = Array.from(document.querySelectorAll('script[type="module"]'))
              .map(function(s) { return s.src; }).join('\n');
            
            showDiagnosticOverlay(
              "Hata: Uygulama pencereleri çizilemedi (Beyaz Ekran Sınırı Aşıldı).\n\n" +
              "Bu durum genellikle eski tarayıcı önbelleğinden veya sunucudaki geçici dosya güncellemelerinden kaynaklanır.\n" +
              "Lütfen yukarıdaki 'Önbelleği Temizle' butonuna tıklayarak açmayı deneyin.\n\n" +
              "Yüklenen ana modüller:\n" + loadedDetails
            );
          }
        }, 4500);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
